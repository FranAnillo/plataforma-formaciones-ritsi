services:
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: plataforma_formativa_ritsi
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FORMATIONS_SHEET_ID: ${FORMATIONS_SHEET_ID:-1JSRrepNNdQDl6zeroZPDKUJztLhSC3j6r7y2h_ND09c}
      AUTO_IMPORT_FORMATIONS: ${AUTO_IMPORT_FORMATIONS:-true}
      AUTO_IMPORT_UNIVERSITIES: ${AUTO_IMPORT_UNIVERSITIES:-true}
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    environment:
      VITE_BACKEND_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # 🔴 SERVICIO DE SCRIPTS
  scripts:
    build: ./backend
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: plataforma_formativa_ritsi
      PYTHONPATH: /app
    depends_on:
      - mongo
    working_dir: /app
    restart: "no"

volumes:
  mongo_data:
